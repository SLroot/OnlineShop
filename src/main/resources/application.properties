spring.application.name=online-shop

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/shopdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=ChangeThisToALongRandomSecretKeyAtLeast32CharactersLong
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.doc-expansion=none

#Admin
app.admin.email=
app.admin.password=

app.upload.dir=./uploads/products
app.upload.public-prefix=/media/products

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=8MB