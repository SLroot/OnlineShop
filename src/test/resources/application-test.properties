# دیتابیس در حافظه — با هر اجرا تازه ساخته می‌شود
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT — کلید جداگانه برای تست
app.jwt.secret=TestOnlySecretKeyThatIsLongEnoughForHmacSha256Algorithm
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# ادمین اولیه
app.admin.email=admin@test.local
app.admin.password=AdminTest@123

# آپلود در پوشه موقت
app.upload.dir=./target/test-uploads
app.upload.public-prefix=/media/products

# زمان‌بندها در تست خاموش
spring.task.scheduling.enabled=false

logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

logging.level.com.shop.online_shop=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG